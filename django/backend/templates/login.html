{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 | 管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#165DFF',
                        secondary: '#36CFC9',
                    },
                }
            }
        }
    </script>
    
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-gradient-primary {
                background: linear-gradient(135deg, #165DFF 0%, #36CFC9 100%);
            }
            .transition-custom {
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
        }
    </style>
</head>
<body class="font-sans bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-6xl">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
            <!-- 左侧装饰区域 -->
            <div class="bg-gradient-primary md:w-1/2 p-8 md:p-12 text-white relative overflow-hidden">
                <div class="absolute inset-0 overflow-hidden">
                    <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full"></div>
                    <div class="absolute left-1/4 bottom-10 w-60 h-60 bg-white/5 rounded-full"></div>
                    <div class="absolute right-1/3 top-1/3 w-20 h-20 bg-white/15 rounded-full"></div>
                </div>
                
                <div class="relative z-10 h-full flex flex-col justify-between">
                    <div>
                        <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold mb-2">管理系统</h1>
                        <p class="text-white/80 max-w-md">高效、安全的后台管理解决方案，为您的业务保驾护航。</p>
                    </div>
                    
                    <div class="mt-12">
                        <div class="flex items-center mb-6">
                            <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center mr-4">
                                <i class="fa fa-shield text-xl"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold text-lg">安全可靠</h3>
                                <p class="text-white/70 text-sm">多重加密保障数据安全</p>
                            </div>
                        </div>
                        
                        <div class="flex items-center">
                            <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center mr-4">
                                <i class="fa fa-bolt text-xl"></i>
                            </div>
                            <div>
                                <h3 class="font-semibold text-lg">高效便捷</h3>
                                <p class="text-white/70 text-sm">优化的工作流程提升效率</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧登录表单区域 -->
            <div class="md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                <div class="max-w-md mx-auto w-full">
                    <div class="text-center mb-8">
                        <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-gray-800 mb-2">欢迎回来</h2>
                        <p class="text-gray-500">请输入账号密码登录系统</p>
                    </div>
                    
                    {% verbatim %}
                    <form @submit.prevent="handleLogin" class="space-y-5">
                        <!-- 用户名输入 -->
                        <div class="space-y-2">
                            <label for="username" class="block text-sm font-medium text-gray-700">用户名</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                    <i class="fa fa-user"></i>
                                </div>
                                <input 
                                    type="text" 
                                    id="username" 
                                    v-model="form.username"
                                    :class="{'border-red-500 focus:ring-red-500': errors.username, 'border-gray-300 focus:ring-primary': !errors.username}"
                                    class="w-full pl-10 pr-3 py-3 border rounded-lg focus:outline-none focus:ring-2 transition-custom"
                                    placeholder="请输入用户名"
                                >
                            </div>
                            <p v-if="errors.username" class="text-red-500 text-sm">{{ errors.username }}</p>
                        </div>
                        
                        <!-- 密码输入 -->
                        <div class="space-y-2">
                            <label for="password" class="block text-sm font-medium text-gray-700">密码</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                    <i class="fa fa-lock"></i>
                                </div>
                                <input 
                                    :type="showPassword ? 'text' : 'password'" 
                                    id="password" 
                                    v-model="form.password"
                                    :class="{'border-red-500 focus:ring-red-500': errors.password, 'border-gray-300 focus:ring-primary': !errors.password}"
                                    class="w-full pl-10 pr-10 py-3 border rounded-lg focus:outline-none focus:ring-2 transition-custom"
                                    placeholder="请输入密码"
                                >
                                <button 
                                    type="button" 
                                    @click="showPassword = !showPassword"
                                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-custom"
                                >
                                    <i :class="showPassword ? 'fa fa-eye-slash' : 'fa fa-eye'"></i>
                                </button>
                            </div>
                            <p v-if="errors.password" class="text-red-500 text-sm">{{ errors.password }}</p>
                        </div>
                        
                        <!-- 记住密码和忘记密码 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center">
                                <input 
                                    type="checkbox" 
                                    id="remember" 
                                    v-model="form.remember"
                                    class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                                >
                                <label for="remember" class="ml-2 block text-sm text-gray-700">记住我</label>
                            </div>
                        </div>
                        
                        <!-- 登录按钮 -->
                        <button 
                            type="submit"
                            :disabled="isLoading"
                            class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg transition-custom flex items-center justify-center disabled:opacity-70 disabled:cursor-not-allowed"
                        >
                            <span v-if="!isLoading">登录</span>
                            <span v-if="isLoading" class="flex items-center">
                                <i class="fa fa-spinner fa-spin mr-2"></i> 登录中...
                            </span>
                        </button>
                        
                        <!-- 错误提示 -->
                        <div v-if="loginError" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded relative" role="alert">
                            <i class="fa fa-exclamation-circle mr-2"></i>
                            <span>{{ loginError }}</span>
                        </div>
                    </form>
                    {% endverbatim %}
                </div>
            </div>
        </div>
        
        <!-- 页脚 -->
        <!-- div class="mt-8 text-center text-gray-500 text-sm">
            © 2025管理系统. 保留所有权利.
        </！div -->
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    form: {
                        username: '',
                        password: '',
                        remember: false
                    },
                    errors: {},
                    loginError: '',
                    showPassword: false,
                    isLoading: false
                }
            },
            methods: {
                validateForm() {
                    this.errors = {};
                    let isValid = true;
                    
                    if (!this.form.username.trim()) {
                        this.errors.username = '请输入用户名';
                        isValid = false;
                    }
                    
                    if (!this.form.password) {
                        this.errors.password = '请输入密码';
                        isValid = false;
                    }
                    
                    return isValid;
                },
                
                async handleLogin() {
                    this.loginError = '';
                    if (!this.validateForm()) return;

                    const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';

                    this.isLoading = true;
                    try {
                        const formData = new URLSearchParams();
                        formData.append('username', this.form.username);
                        formData.append('password', this.form.password);
                        formData.append('remember', this.form.remember);

                        const response = await axios.post("{% url 'login' %}", formData, {
                            headers: {
                                'X-CSRFToken': csrftoken,
                                'Content-Type': 'application/x-www-form-urlencoded'
                            }
                        });

                        if (response.data.success) {
                            window.location.href = response.data.redirect_url || "{% url 'dashboard' %}";
                        } else {
                            this.loginError = response.data.message || '登录失败，请重试';
                        }
                    } catch (error) {
                        this.loginError = error.response?.data?.message || '服务器错误，请稍后再试';
                    } finally {
                        this.isLoading = false;
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
